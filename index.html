<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FXRL // Núcleo Eléctrico</title>
<style>
  :root{
    --bg:#03080d;
    --cyan:#00e5ff;
    --cyan2:#55f3ff;
    --soft:#8befff;
    --text:#d8faff;
    --muted:#6e9098;
    --line:rgba(0,229,255,.18);
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  body{
    position:fixed;
    inset:0;
  }

  #canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><g fill='none' stroke='%23020608' stroke-width='4' stroke-linecap='round'><circle cx='16' cy='16' r='9'/><path d='M16 2v6M16 24v6M2 16h6M24 16h6'/></g><circle cx='16' cy='16' r='3.8' fill='%23020608'/><g fill='none' stroke='%2300e5ff' stroke-width='1.6' stroke-linecap='round'><circle cx='16' cy='16' r='9'/><path d='M16 2v6M16 24v6M2 16h6M24 16h6' stroke-width='1.3'/></g><circle cx='16' cy='16' r='2.4' fill='white'/></svg>") 16 16, crosshair;
  }

  .hud{
    position:absolute;
    inset:0;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:28px 32px;
  }

  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:30px;
    letter-spacing:.12em;
    text-transform:uppercase;
  }

  .brand{
    display:flex;
    flex-direction:column;
    gap:5px;
  }

  .brand strong{
    font:700 clamp(18px,2vw,27px)/1 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#ecfeff;
    letter-spacing:.18em;
  }

  .brand span{
    font:500 10px/1.2 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--muted);
  }

  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font:600 10px/1 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--soft);
  }

  .status i{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 13px var(--cyan);
    animation:blink 1.4s infinite ease-in-out;
  }

  @keyframes blink{50%{opacity:.25}}

  .center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(78vw,560px);
    text-align:center;
  }

  .core-label{
    font:700 clamp(28px,5vw,66px)/.95 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em;
    text-shadow:0 0 18px rgba(0,229,255,.38);
  }

  .core-sub{
    margin-top:15px;
    font:500 10px/1.4 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.32em;
    color:var(--muted);
  }

  .focus{
    margin-top:24px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
  }

  .chip{
    border:1px solid rgba(0,229,255,.22);
    background:rgba(3,8,13,.32);
    backdrop-filter:blur(8px);
    padding:7px 10px;
    border-radius:999px;
    font:600 9px/1 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#a9dfe6;
    letter-spacing:.12em;
  }

  .bottom{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:30px;
  }

  .hint{
    max-width:330px;
    font:500 10px/1.6 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--muted);
    letter-spacing:.05em;
  }

  .hint b{color:var(--soft)}

  .coords{
    text-align:right;
    font:500 9px/1.6 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#4e7179;
    letter-spacing:.08em;
  }

  .scan{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px) 0 0/100% 4px,
      radial-gradient(circle at 50% 50%, transparent 0 18%, rgba(0,229,255,.018) 18.2% 18.5%, transparent 19%);
    mix-blend-mode:screen;
    opacity:.32;
  }

  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle at center,transparent 28%,rgba(0,0,0,.16) 58%,rgba(0,0,0,.72) 100%);
  }

  @media (max-width:700px){
    .hud{padding:20px 18px}
    .top{align-items:flex-start}
    .status{margin-top:2px}
    .core-sub{letter-spacing:.18em}
    .hint{max-width:220px}
    .coords{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    .status i{animation:none}
  }
</style>
</head>
<body>
<canvas id="canvas" aria-label="FXRL01 interactive electric core"></canvas>

<div class="scan"></div>
<div class="vignette"></div>

<div class="hud">
  <div class="top">
    <div class="brand">
      <strong>FXRL</strong>
    </div>
    <div class="status"><i></i> NÚCLEO ACTIVO</div>
  </div>


  <div class="bottom">
    <div class="hint">
      <b>INTERACCIÓN //</b><br>
      Mueve el cursor por el campo. El núcleo te sigue y la red responde.
    </div>
    <div class="coords" id="coords">X: ---- &nbsp; Y: ----<br>CAMPO: EN ESPERA</div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha: true });

  let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  let cx = 0, cy = 0;
  let frame = 0;

  const pointer = { x: 0, y: 0, active: false, lastX: 0, lastY: 0, speed: 0 };
  const target = { x: 0, y: 0, vx: 0, vy: 0 };
  let beat = 0, excite = 0, dtMs = 16.667;
  const LEGS = [];

  const TAU = Math.PI * 2;
  const TWO = Math.PI * 0.5;

  const filaments = [];
  const particles = [];
  const pulses = [];

  // Original take on the "tentacle/segment" idea:
  // radial filaments are anchored to a breathing core but bend toward
  // a moving energy source (mouse or autonomous orbit).
  class Filament {
    constructor(i, total) {
      this.i = i;
      this.total = total;
      this.baseAngle = (i / total) * TAU + (Math.random() - .5) * .11;
      this.length = 110 + Math.random() * Math.min(w, h) * .24;
      this.segments = 18 + Math.floor(Math.random() * 15);
      this.width = .45 + Math.random() * 1.35;
      this.phase = Math.random() * TAU;
      this.speed = .002 + Math.random() * .006;
      this.bend = 0.55 + Math.random() * 1.1;
      this.energy = Math.random();
      this.points = Array.from({length:this.segments+1}, () => ({x:0,y:0}));
    }

    update(time) {
      const breathing = 1 + Math.sin(time * .0016 + this.phase) * .045 + beat * .10;
      const baseR = 30 * breathing;
      const ba = this.baseAngle + time * .00005;   // slow living swirl

      // The whole network is anchored to the moving core.
      let anchorX = target.x + Math.cos(ba) * baseR;
      let anchorY = target.y + Math.sin(ba) * baseR;

      // The network leans toward the cursor while the core catches up.
      const lag = pointer.active ? Math.hypot(pointer.x - target.x, pointer.y - target.y) : 0;
      const lagF = Math.min(1, lag / 90);
      const dx = pointer.x - anchorX;
      const dy = pointer.y - anchorY;
      const dist = Math.hypot(dx,dy);
      const influence = pointer.active ? Math.min(1, lag / 140) : 0;

      const aim = Math.atan2(pointer.y - target.y, pointer.x - target.x);
      const offset = Math.sin(time * this.speed + this.phase) * 0.16
                   + influence * Math.sin(time*.007 + this.phase) * 0.26;

      for(let j=0;j<=this.segments;j++){
        const p = j / this.segments;
        const rr = p * this.length;
        const wave = Math.sin(p * 7 + this.phase + time*.0022) * (7 + 18*p) * this.bend;
        const wave2 = Math.cos(p * 11 - this.phase + time*.0014) * 4 * p;

        let ang = ba + offset + Math.sin(p*2.4 + this.phase)*0.12;

        // Curve toward the active energy source.
        ang += Math.sin(aim - ang) * influence * (0.30 + p*.45);

        let x = anchorX + Math.cos(ang) * rr;
        let y = anchorY + Math.sin(ang) * rr;

        // Perpendicular organic displacement.
        x += Math.cos(ang + Math.PI/2) * (wave + wave2) * p;
        y += Math.sin(ang + Math.PI/2) * (wave + wave2) * p;

        // Motion drag: tips trail behind the core like living tissue.
        const drag = p * p * 5;
        x -= Math.max(-150, Math.min(150, target.vx * drag));
        y -= Math.max(-150, Math.min(150, target.vy * drag));

        // Near the cursor, create a subtle repulsion sheath.
        if(pointer.active && dist < 260 && lagF > 0) {
          const pdx = x - pointer.x;
          const pdy = y - pointer.y;
          const pd = Math.hypot(pdx,pdy) || 1;
          const push = Math.max(0, 1 - pd/260) * 16 * (0.4 + p) * lagF;
          x += pdx/pd * push;
          y += pdy/pd * push;
        }

        this.points[j].x = x;
        this.points[j].y = y;
      }
    }

    draw(time) {
      const pulseChance = 0.0018 + this.energy * .0012;
      if(Math.random() < pulseChance) {
        pulses.push(new Pulse(this));
      }

      ctx.beginPath();
      ctx.moveTo(this.points[0].x, this.points[0].y);

      for(let j=1;j<this.points.length-1;j++){
        const p1=this.points[j], p2=this.points[j+1];
        const mx=(p1.x+p2.x)/2;
        const my=(p1.y+p2.y)/2;
        ctx.quadraticCurveTo(p1.x,p1.y,mx,my);
      }

      const hue = 185 + this.energy*30;
      const alpha = .08 + this.energy*.16;
      ctx.strokeStyle = `hsla(${hue},100%,68%,${alpha})`;
      ctx.lineWidth = this.width;
      ctx.shadowBlur = 8;
      ctx.shadowColor = `hsla(${hue},100%,60%,${alpha})`;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Fine conductive spine.
      if(this.energy > .74){
        ctx.beginPath();
        for(let j=0;j<this.points.length;j+=3){
          const p=this.points[j];
          if(j===0) ctx.moveTo(p.x,p.y);
          else ctx.lineTo(p.x,p.y);
        }
        ctx.strokeStyle = `rgba(150,250,255,${.10 + this.energy*.12})`;
        ctx.lineWidth = .4;
        ctx.stroke();
      }
    }
  }

  class Pulse {
    constructor(filament) {
      this.f = filament;
      this.t = 0;
      this.speed = .015 + Math.random()*.012;
      this.life = 1;
      this.offset = Math.floor(Math.random() * (filament.points.length-1));
    }

    update() {
      this.t += this.speed;
      this.life -= .012;
      return this.life > 0 && this.t < 1;
    }

    draw() {
      const idx = this.offset + Math.floor(this.t * 7);
      const a = this.f.points[Math.min(idx, this.f.points.length-1)];
      if(!a) return;
      const r = 1.2 + this.life*2.2;

      ctx.beginPath();
      ctx.arc(a.x,a.y,r,0,TAU);
      ctx.fillStyle=`rgba(210,255,255,${this.life*.95})`;
      ctx.shadowBlur=12;
      ctx.shadowColor="rgba(0,229,255,.95)";
      ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  function spawnParticle() {
    const ang = Math.random()*TAU;
    const rr = 90 + Math.random()*Math.min(w,h)*.46;
    particles.push({
      x: cx+Math.cos(ang)*rr,
      y: cy+Math.sin(ang)*rr,
      vx: (Math.random()-.5)*.08,
      vy: (Math.random()-.5)*.08,
      r: .35+Math.random()*1.2,
      a: .15+Math.random()*.42,
      phase: Math.random()*TAU
    });
  }

  function resize() {
    dpr=Math.min(window.devicePixelRatio || 1, 2);
    w=window.innerWidth;
    h=window.innerHeight;
    canvas.width=Math.floor(w*dpr);
    canvas.height=Math.floor(h*dpr);
    canvas.style.width=w+"px";
    canvas.style.height=h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx=w/2;
    cy=h/2;
    target.x=cx;
    target.y=cy;

    initLegs();
    const count=Math.min(270, Math.max(150, Math.floor((w*h)/7200)));
    filaments.length=0;
    for(let i=0;i<count;i++) filaments.push(new Filament(i,count));

    particles.length=0;
    for(let i=0;i<Math.min(150,Math.max(70,Math.floor((w*h)/9000)));i++) spawnParticle();
  }

  function updatePointer(x,y) {
    pointer.lastX=pointer.x;
    pointer.lastY=pointer.y;
    pointer.x=x;
    pointer.y=y;
    pointer.speed=Math.hypot(pointer.x-pointer.lastX,pointer.y-pointer.lastY);
    pointer.active=true;
  }

  canvas.addEventListener("mousemove", e => updatePointer(e.clientX,e.clientY));
  canvas.addEventListener("mouseenter", e => updatePointer(e.clientX,e.clientY));
  canvas.addEventListener("mouseleave", () => { pointer.active=false; });
  canvas.addEventListener("click", () => {
    // Burst of energy.
    for(let i=0;i<14;i++){
      pulses.push({
        x:pointer.x, y:pointer.y, t:i/14, life:1,
        update(){
          this.t += .035;
          this.life -= .02;
          return this.life>0;
        },
        draw(){
          const a=this.t;
          const r=12+a*130;
          ctx.beginPath();
          ctx.arc(this.x,this.y,r,0,TAU);
          ctx.strokeStyle=`rgba(90,245,255,${(1-a)*.16})`;
          ctx.lineWidth=.7;
          ctx.stroke();
        }
      });
    }
  });

  // Touch support.
  canvas.addEventListener("touchmove", e => {
    const t=e.touches[0];
    if(t) updatePointer(t.clientX,t.clientY);
  }, {passive:true});

  function updateCore(time) {
    const idleX=cx+Math.cos(time*.00045)*Math.min(w,h)*.11;
    const idleY=cy+Math.sin(time*.00068)*Math.min(w,h)*.08;

    const dt = Math.min(48, time - (updateCore.last || time)) || 16.667;
    updateCore.last = time;
    dtMs = dt;
    const f60 = dt / 16.667;
    const ease = f => 1 - Math.pow(1 - f, f60);

    const px = target.x, py = target.y;
    if(pointer.active){
      const k = ease(.28);
      target.x += (pointer.x-target.x)*k;
      target.y += (pointer.y-target.y)*k;
    } else {
      const k = ease(.04);
      target.x += (idleX-target.x)*k;
      target.y += (idleY-target.y)*k;
    }

    // Smoothed velocity (px per 60fps frame) drives the trailing tissue.
    const kv = ease(.22);
    target.vx += ((target.x-px)/f60 - target.vx) * kv;
    target.vy += ((target.y-py)/f60 - target.vy) * kv;

    // Excitement: the core glows harder the faster you move.
    const move = Math.min(1, Math.hypot(target.vx, target.vy) / 16);
    excite += (Math.max(move, pointer.active ? .14 : .06) - excite) * ease(.08);

    // Heartbeat (lub-dub).
    const ph = time * .0042;
    beat = Math.pow(Math.max(0, Math.sin(ph)), 8) + .55 * Math.pow(Math.max(0, Math.sin(ph - 1.1)), 8);
  }

  // Illumination + living body drawn BEHIND the filaments (fills the old dark hole).
  function drawBody(time) {
    const x = target.x, y = target.y;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    const amb = Math.min(w,h) * .62;
    let g = ctx.createRadialGradient(x,y,0,x,y,amb);
    g.addColorStop(0, `rgba(0,190,255,${.11 + excite*.12 + beat*.05})`);
    g.addColorStop(.35, "rgba(0,120,220,.045)");
    g.addColorStop(1, "rgba(0,60,140,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x-amb, y-amb, amb*2, amb*2);

    const R = 70 + beat*12 + excite*14;
    g = ctx.createRadialGradient(x,y,0,x,y,R);
    g.addColorStop(0, "rgba(190,255,255,.60)");
    g.addColorStop(.30, "rgba(0,229,255,.34)");
    g.addColorStop(.68, "rgba(0,110,220,.16)");
    g.addColorStop(1, "rgba(0,60,180,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x-R, y-R, R*2, R*2);

    // Swirling plasma wisps.
    for(let i=0;i<8;i++){
      const dir = i % 2 ? -1 : 1;
      const a0 = time*(.0007 + i*.00025)*dir + i*1.7;
      const r = 13 + i*6 + Math.sin(time*.002 + i)*3 + beat*4;
      ctx.beginPath();
      ctx.arc(x, y, r, a0, a0 + 1.0 + Math.sin(time*.0015 + i)*.5);
      ctx.strokeStyle = `hsla(${185+i*7},100%,${66+i*2}%,${.30 + excite*.30})`;
      ctx.lineWidth = 1 + (i%3)*.55;
      ctx.stroke();
    }

    // Orbiting electrons with short tails.
    for(let j=0;j<10;j++){
      const a = time*(.0019 + j*.00021)*(j%2?-1:1) + j*TAU/10;
      const r = 26 + (j%3)*11 + Math.sin(time*.003 + j)*3 + beat*3;
      const ex = x + Math.cos(a)*r, ey = y + Math.sin(a)*r*.85;
      const tx = x + Math.cos(a-.28)*r, ty = y + Math.sin(a-.28)*r*.85;
      ctx.beginPath();
      ctx.moveTo(tx,ty); ctx.lineTo(ex,ey);
      ctx.strokeStyle = "rgba(170,250,255,.35)";
      ctx.lineWidth = .8;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ex, ey, 1.3 + (j%2)*.5, 0, TAU);
      ctx.fillStyle = "rgba(230,255,255,.9)";
      ctx.fill();
    }
    ctx.restore();
  }

  // ---- Walking core: long limbs plant on specific points and step to new ones ----
  function initLegs() {
    LEGS.length = 0;
    const n = 14, R = Math.min(w,h) * .22;
    for(let i=0;i<n;i++){
      const a = i/n*TAU, r = R*(.85 + Math.random()*.3);
      LEGS.push({ i, a, R:r, x:target.x+Math.cos(a)*r, y:target.y+Math.sin(a)*r*.8,
                  sx:0, sy:0, dx:0, dy:0, t:1, lift:0, contact:0,
                  side: Math.sin(a*3) > 0 ? 1 : -1 });
    }
  }

  function landRipple(x, y) {
    pulses.push({ x, y, t:0,
      update(){ this.t += .05; return this.t < 1; },
      draw(){
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3 + this.t*28, 0, TAU);
        ctx.strokeStyle = `rgba(140,250,255,${(1-this.t)*.6})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    });
  }

  function updateLegs() {
    const stride = Math.min(w,h) * .13, n = LEGS.length;
    const cl = v => Math.max(-stride*.9, Math.min(stride*.9, v));
    let stepping = 0;
    for(const l of LEGS) if(l.t < 1) stepping++;
    for(const l of LEGS){
      const rx = target.x + Math.cos(l.a)*l.R, ry = target.y + Math.sin(l.a)*l.R*.8;
      if(l.t < 1){
        l.t = Math.min(1, l.t + dtMs/230);
        const e = l.t < .5 ? 2*l.t*l.t : 1 - Math.pow(-2*l.t+2, 2)/2;
        l.x = l.sx + (l.dx-l.sx)*e;
        l.y = l.sy + (l.dy-l.sy)*e;
        l.lift = Math.sin(l.t*Math.PI);
        if(l.t >= 1){ l.lift = 0; l.contact = 1; landRipple(l.x, l.y); }
      } else {
        l.contact *= .95;
        const d = Math.hypot(rx-l.x, ry-l.y);
        const freeNeighbors = LEGS[(l.i+n-1)%n].t >= 1 && LEGS[(l.i+1)%n].t >= 1;
        if(d > stride && ((stepping < 6 && freeNeighbors) || d > stride*1.9)){
          l.sx = l.x; l.sy = l.y;
          l.dx = rx + cl(target.vx*7);
          l.dy = ry + cl(target.vy*7);
          l.t = 0; stepping++;
        }
      }
    }
  }

  function drawLegs(time) {
    ctx.save();
    ctx.lineCap = "round";
    for(const l of LEGS){
      const ax = target.x + Math.cos(l.a)*20, ay = target.y + Math.sin(l.a)*17;
      const dx = l.x-ax, dy = l.y-ay, dist = Math.hypot(dx,dy) || 1;
      const nx = -dy/dist, ny = dx/dist;
      const bow = dist*.20*l.side + Math.sin(time*.004 + l.a*5)*4;
      const up = l.lift*38;
      const c1x = ax + dx*.30 + nx*bow, c1y = ay + dy*.30 + ny*bow - up;
      const c2x = ax + dx*.76 + nx*bow*.5, c2y = ay + dy*.76 + ny*bow*.5 - up*.8;

      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.bezierCurveTo(c1x, c1y, c2x, c2y, l.x, l.y);
      ctx.strokeStyle = "rgba(0,229,255,.16)";
      ctx.lineWidth = 4;
      ctx.shadowBlur = 14; ctx.shadowColor = "rgba(0,229,255,.8)";
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(170,250,255,.78)";
      ctx.lineWidth = 1.3;
      ctx.stroke();

      // planted contact point
      ctx.beginPath();
      ctx.arc(l.x, l.y, 9 + l.contact*6, 0, TAU);
      ctx.strokeStyle = `rgba(120,245,255,${.10 + l.contact*.35})`;
      ctx.lineWidth = .8;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(l.x, l.y, 2.2 + l.contact*2.4, 0, TAU);
      ctx.fillStyle = "rgba(230,255,255,.95)";
      ctx.shadowBlur = 12; ctx.shadowColor = "rgba(0,229,255,.95)";
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  function drawCore(time) {
    const breathe = 1 + beat*.14 + Math.sin(time*.004)*.04;
    const radius = 24*breathe;

    // outer rings
    for(let i=0;i<4;i++){
      const r=58+i*17+Math.sin(time*.0015+i)*4;
      ctx.beginPath();
      ctx.arc(target.x,target.y,r,0,TAU);
      ctx.strokeStyle=`rgba(0,229,255,${.045-i*.006})`;
      ctx.lineWidth=.7;
      ctx.stroke();
    }

    const g=ctx.createRadialGradient(target.x,target.y,0,target.x,target.y,120);
    g.addColorStop(0,"rgba(170,255,255,.95)");
    g.addColorStop(.08,"rgba(0,229,255,.52)");
    g.addColorStop(.28,"rgba(0,229,255,.12)");
    g.addColorStop(1,"rgba(0,229,255,0)");
    ctx.fillStyle=g;
    ctx.fillRect(target.x-120,target.y-120,240,240);

    ctx.beginPath();
    ctx.arc(target.x,target.y,radius,0,TAU);
    ctx.fillStyle="rgba(221,255,255,.96)";
    ctx.shadowBlur=32;
    ctx.shadowColor="rgba(0,229,255,.95)";
    ctx.fill();
    ctx.shadowBlur=0;

    ctx.beginPath();
    ctx.arc(target.x,target.y,8+breathe*2,0,TAU);
    ctx.fillStyle="white";
    ctx.fill();

    // energy crosshair
    const arm=44+Math.sin(time*.003)*4;
    ctx.strokeStyle="rgba(100,245,255,.55)";
    ctx.lineWidth=.8;
    ctx.beginPath();
    ctx.moveTo(target.x-arm,target.y);
    ctx.lineTo(target.x-arm+12,target.y);
    ctx.moveTo(target.x+arm,target.y);
    ctx.lineTo(target.x+arm-12,target.y);
    ctx.moveTo(target.x,target.y-arm);
    ctx.lineTo(target.x,target.y-arm+12);
    ctx.moveTo(target.x,target.y+arm);
    ctx.lineTo(target.x,target.y+arm-12);
    ctx.stroke();
  }

  function drawParticles(time) {
    for(const p of particles){
      p.x += p.vx + Math.sin(time*.0006+p.phase)*.015;
      p.y += p.vy + Math.cos(time*.0007+p.phase)*.015;

      if(p.x < -20 || p.x > w+20 || p.y < -20 || p.y > h+20){
        p.x=Math.random()*w;
        p.y=Math.random()*h;
      }

      const dx=p.x-target.x, dy=p.y-target.y;
      const d=Math.hypot(dx,dy);
      let a=p.a*(.72+.28*Math.sin(time*.002+p.phase));

      if(d<190){
        a*=1.7;
      }

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,TAU);
      ctx.fillStyle=`rgba(120,242,255,${a})`;
      ctx.fill();
    }
  }

  function drawFieldGrid() {
    ctx.save();
    ctx.strokeStyle="rgba(0,229,255,.024)";
    ctx.lineWidth=.5;

    const gap=Math.max(42, Math.min(75,w/18));
    for(let x=0;x<w;x+=gap){
      ctx.beginPath();
      ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
    }
    for(let y=0;y<h;y+=gap){
      ctx.beginPath();
      ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    }

    // Faint horizontal scan.
    const scan=(frame*0.55)%h;
    ctx.strokeStyle="rgba(90,245,255,.028)";
    ctx.beginPath();
    ctx.moveTo(0,scan);
    ctx.lineTo(w,scan);
    ctx.stroke();

    ctx.restore();
  }

  function render(time) {
    frame++;

    // Subtle trail rather than a hard clear: gives the field a living afterimage.
    ctx.fillStyle="rgba(3,8,13,.20)";
    ctx.fillRect(0,0,w,h);

    drawFieldGrid();
    drawParticles(time);

    // Sort visually: distant filaments first.
    updateCore(time);
    updateLegs();
    drawBody(time);
    for(const f of filaments) f.update(time);
    for(const f of filaments) f.draw(time);
    drawLegs(time);

    drawCore(time);

    for(let i=pulses.length-1;i>=0;i--){
      if(!pulses[i].update()) pulses.splice(i,1);
      else pulses[i].draw();
    }

    const coords=document.getElementById("coords");
    if(pointer.active){
      coords.innerHTML=`X: ${Math.round(pointer.x).toString().padStart(4,"0")} &nbsp; Y: ${Math.round(pointer.y).toString().padStart(4,"0")}<br>CAMPO: ACTIVO`;
    }else{
      coords.innerHTML=`X: ---- &nbsp; Y: ----<br>CAMPO: AUTÓNOMO`;
    }

    requestAnimationFrame(render);
  }

  resize();
  window.addEventListener("resize",resize,{passive:true});
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
